[build-system]
requires = ["setuptools>=42", "wheel", "torch>=1.12.0"]
build-backend = "setuptools.build_meta"

[project]
name = "crm_torch_ext"
version = "0.1.0"
description = "PyTorch C++ Extension for CRM Catheter Dynamics"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "torch>=1.12.0",
    "numpy>=1.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-benchmark>=4.0.0",
]
